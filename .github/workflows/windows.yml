name: Windows x64

# Checks run on every desktop change; the exe is built only for a release tag.
# Nothing is published from here except the release's assets and update
# manifest.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "desktop/**"
      - ".github/nsis/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/nsis/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or SHA to build'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  check:
    name: Format, check and test
    runs-on: windows-latest
    outputs:
      checkout_sha: ${{ steps.checkout_sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Record checkout SHA
        id: checkout_sha
        shell: pwsh
        run: echo "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/target/
          key: ${{ runner.os }}-desktop-cargo-check-v2-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cargo-check-v2-

      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Check workspace
        run: cargo check --manifest-path desktop/Cargo.toml --workspace --target x86_64-pc-windows-msvc --locked

      - name: Verify release binary target
        run: cargo check --manifest-path desktop/Cargo.toml -p hylki --bin hylki --target x86_64-pc-windows-msvc --locked

      - name: Run unit tests
        run: cargo test --manifest-path desktop/Cargo.toml --workspace --target x86_64-pc-windows-msvc --locked

  build-windows-x64:
    name: Build Windows x64
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.checkout_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/target/
          key: ${{ runner.os }}-desktop-cargo-release-v2-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cargo-release-v2-

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '0.0.0-dev'
          $tag = 'v0.0.0-dev'
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$') {
              throw "Unsupported release tag: $tag"
            }
            $version = $tag.Substring(1)
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path "$nsis\makensis.exe")) { throw 'NSIS not found' }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build release binary
        shell: pwsh
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
          HYLKI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = 'desktop/target/x86_64-pc-windows-msvc/release/hylki.exe'
          Remove-Item -Force -ErrorAction SilentlyContinue $exe
          cargo build --manifest-path desktop/Cargo.toml -p hylki --bin hylki --release --target x86_64-pc-windows-msvc --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $exe)) { throw "Expected release binary was not produced: $exe" }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # VIProductVersion 只接受四段纯数字，去掉预发布后缀。
          $vi = ($version -split '-')[0] + '.0'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          makensis /DVERSION=$version /DVI_VERSION=$vi .github/nsis/hylki.nsi
          $setup = "dist/Hylki_${version}_x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not produced: $setup" }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = "dist/Hylki_v${version}_portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "desktop/target/x86_64-pc-windows-msvc/release/hylki.exe" $stage
          # 便携版标记：客户端据此选择 zip 就地更新，而不是运行安装包。
          New-Item -ItemType File -Path "$stage/portable.flag" | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Hylki_v${version}_portable.zip" -Force

      - name: Generate update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $setup = "Hylki_${version}_x64-setup.exe"
          $portable = "Hylki_v${version}_portable.zip"
          $notes = ''
          if (Test-Path 'tools/release-notes.sh') {
            $notes = (bash tools/release-notes.sh $version 2>$null) -join "`n"
          }
          $manifest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                url = "$base/$setup"
                sha256 = (Get-FileHash "dist/$setup" -Algorithm SHA256).Hash.ToLower()
              }
              'windows-x86_64-portable' = [ordered]@{
                url = "$base/$portable"
                sha256 = (Get-FileHash "dist/$portable" -Algorithm SHA256).Hash.ToLower()
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 'dist/latest.json'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hylki-windows-x64
          path: |
            dist/Hylki_*_x64-setup.exe
            dist/Hylki_v*_portable.zip
            dist/latest.json
          if-no-files-found: error

      # Publish the GitHub release directly when a version tag is pushed
      # (beta tags are marked as prerelease so they never replace `latest`).
      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.check.outputs.checkout_sha == github.sha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          assets=(dist/Hylki_*_x64-setup.exe dist/Hylki_v*_portable.zip dist/latest.json)
          prerelease=()
          if [[ "$version" == *-beta.* ]]; then prerelease+=(--prerelease); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --draft=false "${prerelease[@]}"
            exit 0
          fi
          notes=$(mktemp)
          tools/release-notes.sh "$version" >"$notes" 2>/dev/null || printf 'Hylki %s\n' "$version" >"$notes"
          gh release create "$tag" "${prerelease[@]}" --title "Hylki $version" --notes-file "$notes" "${assets[@]}"
