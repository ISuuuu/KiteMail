name: Windows x64

# Checks run on every Rust workspace change; the exe is built only for a release tag.
# Nothing is published from here except the release's assets and update
# manifest.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "data/**"
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tools/release-notes.sh"
      - "CHANGELOG.md"
      - ".github/nsis/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or SHA to build'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  check:
    name: Format, check and test
    runs-on: windows-latest
    outputs:
      checkout_sha: ${{ steps.checkout_sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Record checkout SHA
        id: checkout_sha
        shell: pwsh
        run: echo "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
          prefix-key: "check-v2"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Run frontend unit tests
        run: pnpm test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Tauri Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check root Cargo workspace
        run: cargo check --workspace --target x86_64-pc-windows-msvc --locked

      - name: Run root workspace unit tests
        run: cargo test --workspace --target x86_64-pc-windows-msvc --locked

      - name: Verify Tauri release binary target
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin kitemail --target x86_64-pc-windows-msvc --locked

      - name: Run Tauri unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --locked

  build-windows-x64:
    name: Build Windows x64
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.checkout_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
          prefix-key: "release-v2"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '0.0.0-dev'
          $tag = 'v0.0.0-dev'
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$') {
              throw "Unsupported release tag: $tag"
            }
            $version = $tag.Substring(1)
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path "$nsis\makensis.exe") -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          if (Test-Path "$nsis\makensis.exe") {
            $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            throw 'NSIS not found'
          }

      - name: Build Tauri release binary
        shell: pwsh
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
          KITEMAIL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = 'src-tauri/target/x86_64-pc-windows-msvc/release/kitemail.exe'
          Remove-Item -Force -ErrorAction SilentlyContinue $exe
          pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $exe)) { throw "Expected release binary was not produced: $exe" }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # VIProductVersion 只接受四段纯数字，去掉预发布后缀。
          $vi = ($version -split '-')[0] + '.0'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          makensis /DVERSION=$version /DVI_VERSION=$vi /DBUILD_DIR=..\..\src-tauri\target\x86_64-pc-windows-msvc\release .github/nsis/kitemail.nsi
          $setup = "dist/KiteMail_${version}_x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not produced: $setup" }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = "dist/KiteMail_v${version}_portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/kitemail.exe" $stage
          # 便携版标记：客户端据此选择 zip 就地更新，而不是运行安装包。
          New-Item -ItemType File -Path "$stage/portable.flag" | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/KiteMail_v${version}_portable.zip" -Force

      - name: Generate update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $setup = "KiteMail_${version}_x64-setup.exe"
          $portable = "KiteMail_v${version}_portable.zip"
          $notes = ''
          if (Test-Path 'tools/release-notes.sh') {
            $notes = (bash tools/release-notes.sh $version 2>$null) -join "`n"
          }
          $manifest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                url = "$base/$setup"
                sha256 = (Get-FileHash "dist/$setup" -Algorithm SHA256).Hash.ToLower()
              }
              'windows-x86_64-portable' = [ordered]@{
                url = "$base/$portable"
                sha256 = (Get-FileHash "dist/$portable" -Algorithm SHA256).Hash.ToLower()
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 'dist/latest.json'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kitemail-windows-x64
          path: |
            dist/KiteMail_*_x64-setup.exe
            dist/KiteMail_v*_portable.zip
            dist/latest.json
          if-no-files-found: error

      # Publish the GitHub release directly when a version tag is pushed
      # (beta tags are marked as prerelease so they never replace `latest`).
      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.check.outputs.checkout_sha == github.sha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          assets=(dist/KiteMail_*_x64-setup.exe dist/KiteMail_v*_portable.zip dist/latest.json)
          prerelease=()
          if [[ "$version" == *-beta.* ]]; then prerelease+=(--prerelease); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --draft=false "${prerelease[@]}"
            exit 0
          fi
          notes=$(mktemp)
          tools/release-notes.sh "$version" >"$notes" 2>/dev/null || printf 'KiteMail %s\n' "$version" >"$notes"
          gh release create "$tag" "${prerelease[@]}" --title "KiteMail $version" --notes-file "$notes" "${assets[@]}"
