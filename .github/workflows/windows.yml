name: Windows x64

# Checks run on every desktop change; the exe is built only for a release tag,
# the way build-appimage.yml and build-arm64.yml are keyed to v* tags. Nothing
# is published from here except the zip attached to the tag's release.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "desktop/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or SHA to build'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  check:
    name: Format, check and test
    runs-on: windows-latest
    outputs:
      checkout_sha: ${{ steps.checkout_sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Record checkout SHA
        id: checkout_sha
        shell: pwsh
        run: echo "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/target/
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cargo-

      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Check workspace
        run: cargo check --manifest-path desktop/Cargo.toml --workspace --target x86_64-pc-windows-msvc --locked

      - name: Run unit tests
        run: cargo test --manifest-path desktop/Cargo.toml --workspace --target x86_64-pc-windows-msvc --locked

  build-windows-x64:
    name: Build Windows x64
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.checkout_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/target/
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cargo-

      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo build --manifest-path desktop/Cargo.toml -p hylki-windows --release --target x86_64-pc-windows-msvc --locked

      - name: Package Windows x64 ZIP
        shell: pwsh
        run: |
          $stage = "dist/hylki-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "desktop/target/x86_64-pc-windows-msvc/release/hylki-windows.exe" $stage
          Copy-Item "LICENSE" $stage
          Copy-Item "README.md" $stage
          @"
          Hylki Windows x64 — AGPL-3.0-or-later Source Offer
          Commit: $(git rev-parse HEAD)
          Repository: https://github.com/${{ github.repository }}
          License: GNU Affero General Public License v3.0 or later (see LICENSE)
          "@ | Set-Content -Encoding UTF8 "$stage/SOURCE_OFFER.txt"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/hylki-windows-x64.zip" -Force

      - name: Upload Windows x64 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hylki-windows-x64
          path: dist/hylki-windows-x64.zip

      # The release page is written by hand (docs/RELEASING.md), so this only
      # adds the asset: to the release if it exists, otherwise to a draft that
      # carries the notes tools/release-notes.sh would have produced.
      - name: Attach the zip to the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.check.outputs.checkout_sha == github.sha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/hylki-windows-x64.zip --clobber
            exit 0
          fi
          notes=$(mktemp)
          tools/release-notes.sh "$version" >"$notes" 2>/dev/null || printf 'Hylki %s\n' "$version" >"$notes"
          gh release create "$tag" --draft --title "Hylki $version" --notes-file "$notes" dist/hylki-windows-x64.zip
