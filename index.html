<!doctype html>
<html lang="zh-CN" data-theme="system" data-color-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KiteMail</title>
    <style>
      html, body, #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #f1f1f1;
        color: #2e2e32;
        font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
      }
      .km-boot-shell {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f1f1f1;
        color: #707074;
        user-select: none;
      }
      .km-boot-spinner {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2.5px solid rgba(53, 132, 228, 0.22);
        border-top-color: #3584e4;
        animation: km-boot-spin 0.8s linear infinite;
      }
      .km-boot-label {
        font-size: 13px;
        letter-spacing: 0.01em;
      }
      @keyframes km-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        html, body, #app, .km-boot-shell {
          background: #131315;
          color: #a3a3aa;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="km-boot-shell" role="status" aria-live="polite" aria-label="正在启动 KiteMail">
        <span class="km-boot-spinner" aria-hidden="true"></span>
        <span class="km-boot-label">正在启动 KiteMail…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
