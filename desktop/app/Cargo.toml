[package]
name = "hylki-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Windows GPUI client for Hylki"

[dependencies]
chrono = { workspace = true }
gpui-kit = { workspace = true }
hylki-mail-core = { path = "../mail-core" }
rfd = { workspace = true }
winreg = "0.55"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
url = { workspace = true }
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
