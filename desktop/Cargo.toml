[workspace]
members = ["mail-core", "app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
gpui-kit = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "time", "macros"] }
futures = "0.3"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "smtp-transport", "builder"] }
mail-parser = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
dirs = "5"
toml = "0.8"
rfd = "0.15"
native-tls = "0.2"
ureq = { version = "2", features = ["json", "socks-proxy", "native-tls"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }
semver = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
url = "2"
