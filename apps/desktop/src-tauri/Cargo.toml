[package]
name = "kitemail-tauri-preview"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "KiteMail Tauri 2 desktop preview host"

[workspace]
members = ["."]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "5"
raw-window-handle = "0.6"
url = "2"
uuid = { version = "1", features = ["v4"] }
kitemail-mail-core = { path = "../../../crates/mail-core" }
kitemail-windows-mail-reader = { path = "../../../crates/windows-mail-reader" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
