[package]
name = "kitemail-windows-mail-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Windows native WebView2 mail reader and document builders for KiteMail"

[dependencies]
data-url = "0.3"
kitemail-mail-core = { path = "../mail-core" }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
